<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>StarBucks</title>

    <!-- Browser Tab Icon -->
    <link
        rel="icon"
        type="image/png"
        href="images/1.png"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >
</head>

<body>

    <!-- ==================================================
         LOADING SCREEN
    ================================================== -->

    <div id="loadingScreen">

        <!-- Ambient glow -->
        <div class="loadingGlow"></div>

        <!-- Dust particles -->
        <div id="particles"></div>

        <!-- Logo -->
        <div class="loadingLogoWrapper">

            <img
                src="images/1.png"
                alt="StarBucks Logo"
                id="loadingLogo"
            >

        </div>

        <!-- Brand Name -->
        <div class="loadingBrand">

            <span>StarBucks</span>

            <div class="loadingLine"></div>

            <small>
                COFFEE EXPERIENCE
            </small>

        </div>

    </div>


    <!-- ==================================================
         HOMEPAGE
    ================================================== -->

    <main id="homePage">

        <!-- ==============================================
             BACKGROUND VIDEO 1
        ============================================== -->

        <video
            id="backgroundVideo1"
            class="backgroundVideo active"
            muted
            playsinline
            preload="auto"
        ></video>


        <!-- ==============================================
             BACKGROUND VIDEO 2
        ============================================== -->

        <video
            id="backgroundVideo2"
            class="backgroundVideo"
            muted
            playsinline
            preload="auto"
        ></video>


        <!-- Dark overlay -->
        <div class="videoOverlay"></div>


        <!-- ==============================================
             NAVBAR
        ============================================== -->

        <header class="navbar">

            <!-- Logo -->

            <a
                href="#"
                class="navLogo"
            >

                <img
                    src="images/1.png"
                    alt="StarBucks Logo"
                >

            </a>


            <!-- Navigation -->

            <nav class="navLinks">

                <a href="#">
                    MENU
                </a>

                <a href="#">
                    MERCHANDISE
                </a>

                <a href="#">
                    REWARDS
                </a>

                <a
                    href="#"
                    class="signIn"
                >
                    Sign in
                </a>

                <a
                    href="#"
                    class="joinNow"
                >
                    Join Now
                </a>

            </nav>

        </header>


        <!-- ==============================================
             HERO
        ============================================== -->

        <section class="hero">

            <div class="heroContent">

                <p class="smallText">
                    WELCOME TO YOUR COFFEE EXPERIENCE
                </p>


                <h1>
                    GOOD COFFEE.<br>
                    GOOD MOMENTS.
                </h1>


                <p class="heroDescription">
                    Discover handcrafted coffee,
                    delicious moments, and a place
                    made for everyone.
                </p>


                <div class="heroButtons">

                    <a
                        href="#"
                        class="primaryButton"
                    >
                        ORDER NOW
                    </a>


                    <a
                        href="#"
                        class="secondaryButton"
                    >
                        EXPLORE MENU
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
