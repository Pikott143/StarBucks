<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Coffee Experience</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==================================================
         LOADING SCREEN
    ================================================== -->

    <div id="loadingScreen">

        <!-- Dust particles -->
        <div id="particles"></div>

        <!-- Logo -->
        <div class="loadingLogoWrapper">

            <img
                src="images/1.png"
                alt="Coffee Logo"
                id="loadingLogo"
            >

        </div>

    </div>


    <!-- ==================================================
         HOMEPAGE
    ================================================== -->

    <main id="homePage">

        <!-- Background Video -->

        <video
            id="backgroundVideo"
            autoplay
            muted
            playsinline
            preload="auto"
        ></video>


        <!-- Dark overlay -->

        <div class="videoOverlay"></div>


        <!-- ==================================================
             NAVBAR
        ================================================== -->

        <header class="navbar">

            <!-- Logo -->

            <a href="#" class="navLogo">

                <img
                    src="images/1.png"
                    alt="Coffee Logo"
                >

            </a>


            <!-- Navigation -->

            <nav class="navLinks">

                <a href="#">MENU</a>

                <a href="#">MERCHANDISE</a>

                <a href="#">REWARDS</a>

                <a href="#" class="signIn">
                    Sign in
                </a>

                <a href="#" class="joinNow">
                    Join Now
                </a>

            </nav>

        </header>


        <!-- ==================================================
             HERO
        ================================================== -->

        <section class="hero">

            <div class="heroContent">

                <p class="smallText">
                    WELCOME TO YOUR COFFEE EXPERIENCE
                </p>


                <h1>
                    GOOD COFFEE.<br>
                    GOOD MOMENTS.
                </h1>


                <p class="heroDescription">
                    Discover handcrafted coffee,
                    delicious moments, and a place
                    made for everyone.
                </p>


                <div class="heroButtons">

                    <a
                        href="#"
                        class="primaryButton"
                    >
                        ORDER NOW
                    </a>


                    <a
                        href="#"
                        class="secondaryButton"
                    >
                        EXPLORE MENU
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
